name: vayobyzh

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-events}
      POSTGRES_USER: ${POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    environment: &app-env
      ENVIRONMENT: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-events}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-events}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SYNC_API_KEY: ${SYNC_API_KEY:?Set SYNC_API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      SYNC_CITY_SLUGS: ${SYNC_CITY_SLUGS:-msk,spb,ekb,kzn,nsk}
      SYNC_HORIZON_DAYS: ${SYNC_HORIZON_DAYS:-120}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-360}
      NOTIFICATION_INTERVAL_SECONDS: ${NOTIFICATION_INTERVAL_SECONDS:-60}
      TIMEPAD_ORGANIZATION_IDS: ${TIMEPAD_ORGANIZATION_IDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  sync:
    build: ./backend
    command: ["python", "-m", "events_api.worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  notifications:
    build: ./backend
    command: ["python", "-m", "events_api.notification_worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  telegram:
    build: ./backend
    command: ["python", "-m", "events_api.bot"]
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      <<: *app-env
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
