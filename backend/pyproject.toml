[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vayobyzh-api"
version = "1.1.0rc1"
description = "Production API for Ваёбыж and the Кытчи recommendation engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "aiogram>=3.12,<4",
  "fastapi>=0.115,<0.120",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
events-sync = "events_api.sync:main"
events-bot = "events_api.bot:main"
events-worker = "events_api.worker:main"
events-notifications = "events_api.notification_worker:main"
events-migrate = "events_api.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["events_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
source = ["events_api"]
branch = true
omit = [
  "events_api/bot.py",
  "events_api/sync.py",
  "events_api/worker.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
