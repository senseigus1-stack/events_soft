name: CI

on:
  push:
    branches: [main, "feature/**", "rc-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=events_api --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - name: Lint Helm chart
        run: helm lint deploy/helm/vayobyzh
      - name: Render default and single-node manifests
        run: |
          helm template vayobyzh deploy/helm/vayobyzh > /tmp/vayobyzh-default.yaml
          helm template vayobyzh deploy/helm/vayobyzh \
            -f deploy/kubernetes/values.single-node.yaml \
            --set-string ingress.host=events.example.com \
            --set-string certManager.email=admin@example.com \
            > /tmp/vayobyzh-single-node.yaml
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          APP_SECRET: ci-app-secret-that-is-long-enough
          SYNC_API_KEY: ci-sync-key
          ADMIN_API_KEY: ci-admin-key
          DOMAIN: events.example.com
          SSL_EMAIL: admin@example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
